services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pujcovna
      POSTGRES_PASSWORD: pujcovna
      POSTGRES_DB: pujcovna
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pujcovna"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pujcovna:pujcovna@db:5432/pujcovna
      PORT: 4000
      JWT_SECRET: dev-tajny-klic-zmen-v-produkci
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
