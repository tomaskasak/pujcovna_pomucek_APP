services:
  - type: web
    name: pujcovna-backend
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm run migrate --prefix backend && npm start --prefix backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pujcovna-db
          property: connectionString

databases:
  - name: pujcovna-db
    plan: free
    databaseName: pujcovna
    user: pujcovna
