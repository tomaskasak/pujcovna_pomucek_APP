name: Sync pricelist from website

# Web reharentkrkonose.cz je pro appku na Renderu blokovaný ochranou
# WEDOS.protection, ale odsud (GitHub Actions) je dostupný normálně.
# Jednou týdně stáhne aktuální ceník a pošle ho appce, ať jsou ceny
# pomůcek v appce vždy stejné jako na webu.
on:
  schedule:
    - cron: "0 6 * * 1" # pondělí 6:00 UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stáhnout a poslat ceník appce
        env:
          APP_URL: https://pujcovna-backend.onrender.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python3 scripts/sync-pricelist.py
