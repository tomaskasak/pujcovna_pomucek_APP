name: TEMP inspect protection headers

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pricelist page
        run: curl -sS -o page.html "https://reharentkrkonose.cz/cenik-sluzeb-pujcovna-rehabilitacnich-pomucek/"
      - name: Convert to plain text
        run: python3 scripts/temp-html-to-text.py > page.txt
      - name: Show result
        run: |
          wc -l page.txt
          echo "---FULL TEXT---"
          cat page.txt
