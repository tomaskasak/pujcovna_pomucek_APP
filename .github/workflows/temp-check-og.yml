name: temp-check-og4
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)"
          curl -s -D /tmp/h -o /tmp/b --max-time 120 -A "$UA" https://pujcovna.reharentkrkonose.cz/verejny-prehled
          grep -i "last-modified" /tmp/h
          grep -o '<meta property="og:[^>]*>' /tmp/b || echo "ŽÁDNÉ og tagy"
          curl -s -o /dev/null --max-time 120 -A "$UA" -w "og-reharent.png: HTTP %{http_code} %{content_type} %{size_download}B\n" https://pujcovna.reharentkrkonose.cz/og-reharent.png
