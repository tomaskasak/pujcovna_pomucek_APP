name: temp-check-og3
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)"
          for host in https://pujcovna.reharentkrkonose.cz https://pujcovna-backend.onrender.com; do
            echo "===== $host/verejny-prehled"
            curl -s -D - -o /tmp/body --max-time 90 -A "$UA" "$host/verejny-prehled" | head -15
            echo "--- body (prvních 1200 znaků):"; head -c 1200 /tmp/body; echo
            echo "--- og tagy:"; grep -o '<meta property="og:[^>]*>' /tmp/body || echo "ŽÁDNÉ"
            curl -s -o /dev/null --max-time 90 -w "og-reharent.png: HTTP %{http_code} %{content_type} %{size_download}B\n" "$host/og-reharent.png"
            curl -s --max-time 60 "$host/api/health"; echo
          done
          echo "===== DNS"; getent hosts pujcovna.reharentkrkonose.cz; dig +short pujcovna.reharentkrkonose.cz CNAME || true
