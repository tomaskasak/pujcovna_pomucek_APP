name: temp-check-logo
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 15); do
            s=$(curl -s -o /dev/null --max-time 90 -w "%{size_download}" "https://pujcovna.reharentkrkonose.cz/icon-512.png?t=$i")
            echo "pokus $i: icon-512.png má $s B (nové logo = 86307 B)"
            [ "$s" = "86307" ] && { echo "nové logo nasazeno"; break; }
            sleep 60
          done
          for f in icon-192.png favicon-32.png icon-maskable-512.png og-reharent-2.png; do
            curl -s -o /dev/null --max-time 90 -w "$f: HTTP %{http_code} %{size_download}B\n" "https://pujcovna.reharentkrkonose.cz/$f"
          done
