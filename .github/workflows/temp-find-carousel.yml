name: TEMP find carousel images on website

on:
  workflow_dispatch: {}

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch homepage and list images
        run: |
          curl -sS "https://reharentkrkonose.cz/" -o home.html
          echo "--- vsechny <img> tagy (src + alt) ---"
          grep -oE '<img[^>]*>' home.html | sed -E 's/<img/\n<img/' | grep -oE 'src="[^"]*"|alt="[^"]*"|data-src="[^"]*"'
          echo "--- pocet img tagu ---"
          grep -oE '<img[^>]*>' home.html | wc -l
