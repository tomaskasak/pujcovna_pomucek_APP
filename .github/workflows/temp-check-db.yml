name: temp-check-db
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for host in https://pujcovna.reharentkrkonose.cz https://pujcovna-backend-urxh.onrender.com https://pujcovna-backend.onrender.com; do
            echo "== $host"
            curl -s --max-time 90 -o /tmp/b -w "public/items: HTTP %{http_code} %{time_total}s\n" "$host/api/public/items"; head -c 200 /tmp/b; echo
          done
