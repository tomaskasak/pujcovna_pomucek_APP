name: Keep app and database awake

# Bezplatný Supabase projekt (databáze appky) se sám pozastaví, pokud na
# appku týden nikdo vůbec nesáhne. Tahle úloha jednou týdně (v pondělí)
# zavolá appku a zároveň jí řekne, ať pošle e-mailem týdenní přehled, a ve
# čtvrtek ještě jednou "jen tak" pro bezpečnou rezervu pod tím týdenním
# limitem (ať appku nikdy nepozastaví ani prodloužený víkend).
on:
  schedule:
    - cron: "0 7 * * 1" # pondělí 7:00 UTC — s mailem
    - cron: "0 7 * * 4" # čtvrtek 7:00 UTC — jen tichý ping
  workflow_dispatch: # jde spustit i ručně (záložka Actions v GitHubu), volitelně i s mailem
    inputs:
      notify:
        description: "Poslat i přehled mailem"
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Zavolat keep-alive endpoint appky
        run: |
          if [ "${{ github.event.schedule }}" = "0 7 * * 1" ] || [ "${{ github.event.inputs.notify }}" = "true" ]; then
            NOTIFY="&notify=1"
          else
            NOTIFY=""
          fi
          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            "https://pujcovna-backend.onrender.com/api/cron/keep-alive?secret=${{ secrets.CRON_SECRET }}${NOTIFY}")
          echo "HTTP status: $HTTP_STATUS"
          cat response.json
          echo
          if [ "$HTTP_STATUS" -ge 400 ]; then
            exit 1
          fi
