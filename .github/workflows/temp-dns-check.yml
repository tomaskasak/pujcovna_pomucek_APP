name: TEMP check custom domain DNS

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS lookup
        run: |
          echo "--- dig CNAME ---"
          dig +short CNAME pujcovna.reharentkrkonose.cz
          echo "--- dig A (resolved) ---"
          dig +short pujcovna.reharentkrkonose.cz
      - name: HTTP check
        run: |
          curl -sS -D - -o /dev/null --max-time 15 "https://pujcovna.reharentkrkonose.cz/api/health" || true
