name: temp-check-deploy
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H=https://pujcovna.reharentkrkonose.cz
          curl -s -D /tmp/h -o /tmp/b --max-time 120 "$H/"
          grep -i "last-modified" /tmp/h
          JS=$(grep -o 'assets/index-[^"]*\.js' /tmp/b | head -1); echo "bundle: $JS"
          curl -s --max-time 120 "$H/$JS" | grep -o 'Jen nezávazná rezervace\|Nový klient…\|public-card-photos' | sort | uniq -c || echo "nic z nových textů"
