name: TEMP check app health

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Health check backend (long timeout, retry)
        run: |
          for i in 1 2 3; do
            echo "--- pokus $i ---"
            curl -sS -w "\nHTTP %{http_code}, cas %{time_total}s\n" --max-time 90 "https://pujcovna-backend.onrender.com/api/health" && break
            echo "pokus $i selhal, cekam 5s"
            sleep 5
          done
