name: TEMP check app health

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Health check backend
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" --max-time 60 "https://pujcovna-backend.onrender.com/api/health"
      - name: DB read check (public items - overuje pristup k datum po RLS)
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" --max-time 60 "https://pujcovna-backend.onrender.com/api/public/items" | head -c 1500
